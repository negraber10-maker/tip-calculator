<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How To Calculate A Tip</title>
</head>
<body>
    Bill Amount <input type="number" id="billAmount">
    Tip Percentage <input type="number" id="tipPercentage">
    <button id="calculateBtn"> Calculate </button>
    <output id="result"> Result: </output>
    <script>
        const billAmount = document.getElementById("billAmount");
        const tipPercentage = document.getElementById("tipPercentage");
        const calculateBtn = document.getElementById("calculateBtn");
        const result = document.getElementById("result");

        calculateBtn.addEventListener("click", function () {
            console.log(billAmount.value);
            console.log(tipPercentage.value);
            const bill = parseFloat(billAmount.value);
            const tip = parseFloat(tipPercentage.value);
            const tipPerc = tip / 100;
                console.log(tipPerc);
            const tipTotal = tipPerc * bill;
                console.log(tipTotal);
            const billTotal = bill + tipTotal;
            console.log(billTotal);
            
            result.textContent = "Tip: $" + tipTotal.toFixed(2) + " Total: $" + billTotal.toFixed(2);
            // code that runs on each click
});

    </script>
</body>
</html>
